# Postgres for when the app runs with DATABASE_URL=postgresql://app:app@localhost:5432/app
#   docker compose up -d        start (data survives restarts in the pgdata volume)
#   http://127.0.0.1:8080       Adminer GUI (below)
#   docker compose exec db psql -U app app
#   docker compose down -v      stop and delete all data
services:
  db:
    image: postgres:17
    # Start again after a crash or reboot (the laptop server relies on this), unless stopped by hand
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Web GUI: http://127.0.0.1:8080, log in with System PostgreSQL, user app, password app, database app
  adminer:
    image: adminer:4.17.1
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
